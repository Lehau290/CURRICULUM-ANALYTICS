<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | CURRICULUM ANALYTICS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #ffffff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: #0f172a;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    .btn-login {
      width: 100%;
      height: 42px;
      margin-top: 8px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-login:hover {
      background: #1e293b;
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="brand">
      <div class="logo">CA</div>
      <span class="brand-name">CURRICULUM ANALYTICS</span>
    </div>

    <h1>Đăng nhập</h1>
    <p class="subtitle">Nhập tài khoản để truy cập hệ thống.</p>

    <div class="error-msg" id="login-error">
      Tên đăng nhập hoặc mật khẩu không đúng.
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">Đăng nhập</button>
    </form>
  </main>

  <script>
    const ACCOUNTS = [
      {
        id: 'admin-02',
        username: 'ngoclan',
        aliases: ['ngọc lan', 'ngoc lan', 'lan'],
        passwords: ['123456', 'Admin@2026'],
        fullName: 'Ngọc Lan',
        role: 'Chủ nhiệm Đề tài 20 & Quản trị viên Phân tích',
        roleCode: 'analytics_admin',
        email: 'ngoclan.research@gmail.com',
        avatarInitials: 'NL',
        avatarBg: 'linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)',
        targetUrl: 'detai20.html'
      },
      {
        id: 'admin-03',
        username: 'kimhan',
        aliases: ['kim hân', 'kim han', 'hân', 'han'],
        passwords: ['123456', 'Admin@2026'],
        fullName: 'Kim Hân',
        role: 'Chủ nhiệm Đề tài 17 & Quản trị viên Chính sách',
        roleCode: 'policy_admin',
        email: 'kimhan.research@gmail.com',
        avatarInitials: 'KH',
        avatarBg: 'linear-gradient(135deg, #059669 0%, #0d9488 100%)',
        targetUrl: 'detai17.html'
      },
      {
        id: 'admin-01',
        username: 'letrunghau',
        aliases: ['lê trung hậu', 'le trung hau', 'hậu', 'hau'],
        passwords: ['Admin@2026', '123456'],
        fullName: 'Lê Trung Hậu',
        role: 'Chủ nhiệm Đề tài 03 & Quản trị viên Cấp cao',
        roleCode: 'lead_admin',
        email: 'lehau290920@gmail.com',
        avatarInitials: 'TH',
        avatarBg: 'linear-gradient(135deg, #0284c7 0%, #0d9488 100%)',
        targetUrl: 'index.html'
      }
    ];

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const rawUser = document.getElementById('username').value.trim().toLowerCase();
      const rawPass = document.getElementById('password').value;
      const errBox = document.getElementById('login-error');

      const matched = ACCOUNTS.find(acc =>
        (acc.username === rawUser || acc.aliases.includes(rawUser)) &&
        acc.passwords.includes(rawPass)
      );

      if (matched) {
        errBox.style.display = 'none';
        localStorage.setItem('ca_current_user', JSON.stringify(matched));
        window.location.href = matched.targetUrl;
      } else {
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
